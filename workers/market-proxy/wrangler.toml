name = "chartlens-market-proxy"
main = "src/index.js"
compatibility_date = "2026-08-30"

[vars]
MEROLAGANI_API_BASE = "https://merolagani.com"
# NEPSE_API_BASE (nepseapi.surajrimal.dev) removed 2026-08-30: the host no
# longer resolves and every call burned the full 12s fetch timeout, on the
# autocomplete path as well as the candles path.
SHAREBAZAAR_API_BASE = "https://nepsetty.kokomo.workers.dev"

# Primary rate limit: 60 requests / 60s per client IP. Free, no KV.
# Exposed to the Worker as env.MARKET_RL; src/index.js also keeps a
# per-isolate fallback limiter in case this binding is absent.
[[ratelimits]]
name = "MARKET_RL"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
